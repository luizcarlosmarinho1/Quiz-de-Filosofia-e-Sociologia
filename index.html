<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Filosófico & Sociológico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a1208;
      --parchment: #f5ede0;
      --parchment-dark: #e8d9c4;
      --wine: #5c1a1a;
      --wine-light: #7a2828;
      --gold: #b8912a;
      --gold-light: #d4aa4a;
      --forest: #1e3628;
      --sage: #4a6741;
      --cream: #fdf6ec;
      --shadow: rgba(26,18,8,0.18);
      --correct: #1e3628;
      --correct-bg: #d4edda;
      --incorrect: #5c1a1a;
      --incorrect-bg: #f8d7da;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Lora', Georgia, serif;
      font-size: 17px;
      background: var(--ink);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(92,26,26,0.25) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 90%, rgba(30,54,40,0.2) 0%, transparent 60%),
        radial-gradient(ellipse 100% 100% at 50% 50%, #1a1208 0%, #0d0a05 100%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 16px;
      border: 1px solid rgba(184,145,42,0.15);
      pointer-events: none;
      z-index: 0;
    }

    .page-wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    .header {
      text-align: center;
      margin-bottom: 36px;
      animation: fadeDown 0.8s ease both;
    }

    .header-ornament {
      color: var(--gold);
      font-size: 24px;
      letter-spacing: 12px;
      margin-bottom: 12px;
      opacity: 0.7;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(32px, 5vw, 54px);
      font-weight: 900;
      color: var(--parchment);
      line-height: 1.1;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .header h1 span {
      color: var(--gold);
      font-style: italic;
    }

    .header-subtitle {
      font-family: 'Lora', serif;
      font-size: 17px;
      font-weight: 500;
      color: rgba(245,237,224,0.55);
      font-style: italic;
      letter-spacing: 1px;
    }

    .progress-section {
      width: 100%;
      max-width: 780px;
      margin-bottom: 28px;
      animation: fadeDown 0.8s 0.1s ease both;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .progress-label {
      font-family: 'Lora', serif;
      font-size: 14px;
      font-weight: 600;
      color: rgba(245,237,224,0.6);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .progress-dots {
      display: flex;
      gap: 5px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(245,237,224,0.15);
      border: 1px solid rgba(184,145,42,0.3);
      transition: all 0.4s ease;
    }

    .dot.answered-correct { background: var(--sage); border-color: var(--sage); }
    .dot.answered-wrong { background: var(--wine-light); border-color: var(--wine-light); }
    .dot.current { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 8px var(--gold); }

    .progress-bar-wrap {
      height: 3px;
      background: rgba(245,237,224,0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--wine), var(--gold));
      border-radius: 2px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .quiz-card {
      width: 100%;
      max-width: 780px;
      background: var(--cream);
      border-radius: 4px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(184,145,42,0.2);
      overflow: hidden;
      animation: fadeUp 0.5s ease both;
      position: relative;
    }

    .quiz-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
    }

    .card-inner {
      padding: 40px 44px 36px;
    }

    .q-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .q-number-badge {
      font-family: 'Lora', serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(184,145,42,0.1);
      border: 1.5px solid rgba(184,145,42,0.35);
      padding: 5px 14px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .q-divider {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(184,145,42,0.3), transparent);
    }

    .q-topic {
      font-family: 'Lora', serif;
      font-size: 13px;
      font-weight: 500;
      color: rgba(26,18,8,0.45);
      font-style: italic;
      letter-spacing: 0.5px;
    }

    .context-block {
      background: var(--parchment);
      border-left: 3px solid var(--gold);
      padding: 18px 22px;
      margin-bottom: 24px;
      border-radius: 0 4px 4px 0;
      position: relative;
    }

    .context-block::before {
      content: '"';
      position: absolute;
      top: -8px;
      left: 14px;
      font-family: 'Playfair Display', serif;
      font-size: 60px;
      color: var(--gold);
      opacity: 0.25;
      line-height: 1;
    }

    .context-text {
      font-family: 'Lora', serif;
      font-size: 16px;
      font-weight: 500;
      font-style: italic;
      color: rgba(26,18,8,0.78);
      line-height: 1.75;
    }

    .question-text {
      font-family: 'Playfair Display', serif;
      font-size: clamp(19px, 2.4vw, 22px);
      font-weight: 700;
      color: var(--ink);
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .answers-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 28px;
    }

    .answer-btn {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 20px;
      background: white;
      border: 1.5px solid rgba(26,18,8,0.12);
      border-radius: 4px;
      cursor: pointer;
      text-align: left;
      transition: all 0.25s ease;
      width: 100%;
      font-family: 'Lora', serif;
      font-size: 16px;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.55;
      position: relative;
      overflow: hidden;
    }

    .answer-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(184,145,42,0.05), transparent);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .answer-btn:hover:not(:disabled)::before { opacity: 1; }

    .answer-btn:hover:not(:disabled) {
      border-color: var(--gold);
      box-shadow: 0 2px 12px rgba(184,145,42,0.15);
      transform: translateX(3px);
    }

    .answer-btn:disabled { cursor: default; }

    .letter-badge {
      font-family: 'Playfair Display', serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--gold);
      background: rgba(184,145,42,0.1);
      border: 1px solid rgba(184,145,42,0.25);
      width: 28px;
      height: 28px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.25s;
    }

    .answer-btn:hover:not(:disabled) .letter-badge {
      background: var(--gold);
      color: white;
    }

    .answer-btn.correct {
      background: #eaf5ec;
      border-color: #2d7a3a;
    }
    .answer-btn.correct .letter-badge {
      background: #2d7a3a;
      color: white;
      border-color: #2d7a3a;
    }

    .answer-btn.wrong {
      background: #fdf0f0;
      border-color: #c0392b;
    }
    .answer-btn.wrong .letter-badge {
      background: #c0392b;
      color: white;
      border-color: #c0392b;
    }

    .answer-btn.dim {
      opacity: 0.45;
    }

    .feedback-box {
      border-radius: 4px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: none;
      animation: slideIn 0.35s ease;
    }

    .feedback-box.show { display: block; }

    .feedback-box.correct-fb {
      background: #eaf5ec;
      border-left: 4px solid #2d7a3a;
    }

    .feedback-box.wrong-fb {
      background: #fdf0f0;
      border-left: 4px solid #c0392b;
    }

    .feedback-title {
      font-family: 'Lora', serif;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .feedback-box.correct-fb .feedback-title { color: #1a5c24; }
    .feedback-box.wrong-fb .feedback-title { color: #8b1a1a; }

    .feedback-body {
      font-family: 'Lora', serif;
      font-size: 15.5px;
      font-weight: 500;
      line-height: 1.65;
      color: inherit;
      opacity: 0.9;
    }

    .retry-hint {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 600;
      font-style: italic;
      opacity: 0.75;
    }

    .nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 8px;
      border-top: 1px solid rgba(26,18,8,0.08);
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 26px;
      border: 1.5px solid;
      border-radius: 3px;
      cursor: pointer;
      font-family: 'Lora', serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: all 0.25s ease;
    }

    .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }

    .btn-prev {
      background: transparent;
      border-color: rgba(26,18,8,0.2);
      color: rgba(26,18,8,0.6);
    }

    .btn-prev:hover:not(:disabled) {
      border-color: var(--ink);
      color: var(--ink);
    }

    .btn-next {
      background: var(--wine);
      border-color: var(--wine);
      color: var(--parchment);
      margin-left: auto;
    }

    .btn-next:hover:not(:disabled) {
      background: var(--wine-light);
      border-color: var(--wine-light);
      transform: translateX(3px);
    }

    .btn-finish {
      background: var(--forest);
      border-color: var(--forest);
      color: var(--parchment);
      margin-left: auto;
    }

    .btn-finish:hover:not(:disabled) {
      background: var(--sage);
      border-color: var(--sage);
      transform: translateX(3px);
    }

    .results-card {
      width: 100%;
      max-width: 780px;
      background: var(--cream);
      border-radius: 4px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(184,145,42,0.2);
      animation: fadeUp 0.5s ease both;
      overflow: hidden;
      display: none;
    }

    .results-card::before {
      content: '';
      display: block;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
    }

    .results-inner {
      padding: 48px 44px;
      text-align: center;
    }

    .results-ornament {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .results-heading {
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 900;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .results-subheading {
      font-family: 'Lora', serif;
      font-size: 16px;
      font-weight: 500;
      font-style: italic;
      color: rgba(26,18,8,0.5);
      margin-bottom: 40px;
    }

    .score-ring-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 36px;
    }

    .score-ring {
      position: relative;
      width: 160px;
      height: 160px;
    }

    .score-ring svg {
      transform: rotate(-90deg);
    }

    .score-ring-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .score-pct {
      font-family: 'Playfair Display', serif;
      font-size: 38px;
      font-weight: 900;
      color: var(--wine);
      line-height: 1;
    }

    .score-label {
      font-family: 'Lora', serif;
      font-size: 14px;
      font-weight: 600;
      color: rgba(26,18,8,0.5);
      letter-spacing: 0.5px;
    }

    .results-feedback-text {
      font-family: 'Lora', serif;
      font-size: 17px;
      font-weight: 500;
      font-style: italic;
      color: rgba(26,18,8,0.7);
      max-width: 480px;
      margin: 0 auto 36px;
      line-height: 1.65;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 40px;
    }

    .stat-block {
      background: var(--parchment);
      border: 1px solid rgba(184,145,42,0.2);
      border-radius: 4px;
      padding: 20px 16px;
    }

    .stat-block-value {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat-block-label {
      font-family: 'Lora', serif;
      font-size: 13px;
      font-weight: 600;
      color: rgba(26,18,8,0.5);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .answer-review {
      margin-bottom: 40px;
      text-align: left;
    }

    .review-title {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .review-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(26,18,8,0.1);
    }

    .review-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .review-pip {
      width: 36px;
      height: 36px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 13px;
      font-weight: 700;
      cursor: default;
    }

    .review-pip.ok {
      background: #eaf5ec;
      color: #2d7a3a;
      border: 1px solid #2d7a3a;
    }

    .review-pip.fail {
      background: #fdf0f0;
      color: #c0392b;
      border: 1px solid #c0392b;
    }

    .retry-btn {
      background: var(--wine);
      color: var(--parchment);
      border: none;
      border-radius: 3px;
      padding: 15px 48px;
      font-family: 'Lora', serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .retry-btn:hover {
      background: var(--wine-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(92,26,26,0.35);
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .shake { animation: shake 0.4s ease; }

    @media (max-width: 600px) {
      .card-inner { padding: 28px 22px 24px; }
      .results-inner { padding: 32px 22px; }
      .stats-row { grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .stat-block-value { font-size: 28px; }
      .progress-dots { display: none; }
    }
  </style>
</head>
<body>
<div class="page-wrapper">

  <header class="header">
    <div class="header-ornament">✦ ✦ ✦</div>
    <h1>Sociologia — <span>Durkheim</span></h1>
    <p class="header-subtitle">Teste seu conhecimento sobre os fatos sociais e a teoria durkheimiana</p>
  </header>

  <div class="progress-section" id="progressSection">
    <div class="progress-meta">
      <span class="progress-label" id="progressLabel">Questão 1 de 15</span>
      <div class="progress-dots" id="progressDots"></div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressFill" style="width:6.67%"></div>
    </div>
  </div>

  <div class="quiz-card" id="quizCard">
    <div class="card-inner" id="cardInner"></div>
  </div>

  <div class="results-card" id="resultsCard">
    <div class="results-inner" id="resultsInner"></div>
  </div>

</div>

<script>
const questions = [
  {
    id: 1, topic: "Método Sociológico",
    context: "Émile Durkheim contribuiu para consolidar a Sociologia como ciência ao defender que os fenômenos sociais deveriam ser observados de maneira objetiva, afastando julgamentos pessoais e buscando regularidades na vida coletiva.",
    text: "Essa orientação metodológica indica que a Sociologia durkheimiana propõe",
    answers: [
      { l: "a", text: "interpretar a sociedade a partir das intenções individuais dos sujeitos.", correct: false, fb: "Incorreta. Durkheim se opõe à análise subjetiva: para ele, os fatos sociais existem independentemente das intenções individuais." },
      { l: "b", text: "analisar os fatos sociais como objetos externos à consciência individual.", correct: true, fb: "Correta! Durkheim defende que os fatos sociais devem ser tratados como coisas — objetos externos, coercitivos e gerais, independentes da vontade individual." },
      { l: "c", text: "explicar os fenômenos coletivos por princípios religiosos compartilhados.", correct: false, fb: "Incorreta. Durkheim separa análise científica de explicação religiosa, ainda que estudasse a religião como fenômeno social." },
      { l: "d", text: "compreender a vida social como resultado direto da liberdade pessoal.", correct: false, fb: "Incorreta. Para Durkheim, a sociedade exerce coerção sobre o indivíduo, limitando sua liberdade pessoal." },
      { l: "e", text: "substituir a observação empírica por reflexões filosóficas abstratas.", correct: false, fb: "Incorreta. Durkheim é justamente o oposto: valoriza a observação empírica dos fatos sociais." }
    ]
  },
  {
    id: 2, topic: "Durkheim e Comte",
    context: "Durkheim foi influenciado pelo positivismo de Auguste Comte, mas considerava necessário tornar a Sociologia mais objetiva, prática e científica. Enquanto Comte observava a sociedade de modo amplo, Durkheim buscava analisar instituições e fenômenos sociais específicos.",
    text: "A diferença entre Comte e Durkheim, conforme a aula, está no fato de Durkheim",
    answers: [
      { l: "a", text: "rejeitar totalmente a possibilidade de estudar cientificamente a sociedade.", correct: false, fb: "Incorreta. Durkheim dedicou sua obra exatamente a consolidar a Sociologia como ciência." },
      { l: "b", text: "deslocar a análise social para explicações psicológicas do comportamento.", correct: false, fb: "Incorreta. Durkheim rejeita explicações psicológicas, insistindo que fatos sociais devem ser explicados por outros fatos sociais." },
      { l: "c", text: "aprofundar o método científico aplicado aos fatos e às instituições sociais.", correct: true, fb: "Correta! Durkheim tornou a Sociologia mais rigorosa e científica, analisando fenômenos específicos como o suicídio, a religião e a divisão do trabalho." },
      { l: "d", text: "defender que a sociedade deveria ser explicada por valores metafísicos.", correct: false, fb: "Incorreta. Durkheim rejeita explicações metafísicas em favor da análise empírica dos fatos sociais." },
      { l: "e", text: "limitar a Sociologia ao estudo da evolução histórica das ideias políticas.", correct: false, fb: "Incorreta. O escopo de Durkheim é mais amplo: abrange instituições, normas, coesão, solidariedade e anomia." }
    ]
  },
  {
    id: 3, topic: "Funcionalismo",
    context: "Em uma comunidade, escola, família, religião, leis e economia atuam como partes de um mesmo sistema. Cada instituição exerce funções que contribuem para a organização coletiva, ainda que também possa apresentar falhas ou tensões.",
    text: "Essa leitura da sociedade aproxima-se do conceito durkheimiano de",
    answers: [

let current = 0;
let answers = {};

function buildDots() {
  const wrap = document.getElementById('progressDots');
  wrap.innerHTML = '';
  questions.forEach((q, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    wrap.appendChild(d);
  });
}

function updateProgress() {
  const pct = ((current + 1) / questions.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `Questão ${current + 1} de ${questions.length}`;

  questions.forEach((q, i) => {
    const d = document.getElementById(`dot-${i}`);
    if (!d) return;
    d.className = 'dot';
    if (i === current) { d.classList.add('current'); }
    else if (answers[q.id]) {
      d.classList.add(answers[q.id].correct ? 'answered-correct' : 'answered-wrong');
    }
  });
}

function render() {
  const q = questions[current];
  const ans = answers[q.id];
  const isLast = current === questions.length - 1;

  let html = `
    <div class="q-header">
      <span class="q-number-badge">Questão ${q.id}</span>
      <div class="q-divider"></div>
      <span class="q-topic">${q.topic}</span>
    </div>
    <div class="context-block">
      <div class="context-text">${q.context}</div>
    </div>
    <div class="question-text">${q.text}</div>
    <div class="answers-list" id="answersList">
  `;

  q.answers.forEach(a => {
    let cls = 'answer-btn';
    let disabled = '';

    if (ans) {
      if (a.l === ans.letter) {
        cls += ans.correct ? ' correct' : ' wrong';
      } else if (ans.correct) {
        cls += ' dim';
      }
      if (ans.correct) disabled = 'disabled';
    }

    html += `
      <button class="${cls}" ${disabled} onclick="pick(${q.id},'${a.l}',${a.correct})">
        <span class="letter-badge">${a.l}</span>
        <span>${a.text}</span>
      </button>
    `;
  });

  html += `</div>`;

  if (ans) {
    const chosen = q.answers.find(a => a.l === ans.letter);
    const fbClass = chosen.correct ? 'correct-fb' : 'wrong-fb';
    const icon = chosen.correct ? '✓' : '✗';
    const title = chosen.correct ? 'Resposta correta!' : 'Resposta incorreta';
    html += `
      <div class="feedback-box show ${fbClass}">
        <div class="feedback-title">${icon} ${title}</div>
        <div class="feedback-body">${chosen.fb}</div>
        ${!chosen.correct ? '<p class="retry-hint">Tente novamente — escolha outra alternativa.</p>' : ''}
      </div>
    `;
  }

  const nextDisabled = !ans || !ans.correct ? 'disabled' : '';
  const prevDisabled = current === 0 ? 'disabled' : '';

  html += `
    <div class="nav-row">
      <button class="nav-btn btn-prev" ${prevDisabled} onclick="go(-1)">← Anterior</button>
      ${isLast
        ? `<button class="nav-btn btn-finish" ${nextDisabled} onclick="showResults()">Ver resultado →</button>`
        : `<button class="nav-btn btn-next" ${nextDisabled} onclick="go(1)">Próxima →</button>`
      }
    </div>
  `;

  document.getElementById('cardInner').innerHTML = html;
  updateProgress();
}

function pick(qId, letter, correct) {
  const prev = answers[qId];
  if (prev && prev.correct) return;

  answers[qId] = { letter, correct };

  if (!correct) {
    const btns = document.querySelectorAll('.answer-btn');
    btns.forEach(b => {
      if (b.querySelector('.letter-badge')?.textContent === letter) {
        b.classList.add('shake');
        setTimeout(() => b.classList.remove('shake'), 400);
      }
    });
  }

  render();
}

function go(dir) {
  current = Math.max(0, Math.min(questions.length - 1, current + dir));
  document.getElementById('cardInner').style.opacity = '0';
  document.getElementById('cardInner').style.transform = 'translateY(10px)';
  setTimeout(() => {
    render();
    document.getElementById('cardInner').style.transition = 'opacity 0.3s ease, transform 0.3s ease';
    document.getElementById('cardInner').style.opacity = '1';
    document.getElementById('cardInner').style.transform = 'translateY(0)';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, 150);
}

  let reviewPips = questions.map((q) => {
    const a = answers[q.id];
    const cls = a && a.correct ? 'ok' : 'fail';
    return `<div class="review-pip ${cls}" title="Questão ${q.id}: ${q.topic}">${q.id}</div>`;
  }).join('');

  document.getElementById('resultsInner').innerHTML = `
    <div class="results-ornament">${emoji}</div>
    <h2 class="results-heading">Quiz Concluído</h2>
    <p class="results-subheading">Émile Durkheim — ${questions.length} questões</p>

    <div class="score-ring-wrap">
      <div class="score-ring">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e8d9c4" stroke-width="10"/>
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#5c1a1a" stroke-width="10"
            stroke-dasharray="${dash} ${circ}" stroke-linecap="round"
            style="transition: stroke-dasharray 1s ease"/>
        </svg>
        <div class="score-ring-text">
          <span class="score-pct">${pct}%</span>
          <span class="score-label">${correct}/${questions.length}</span>
        </div>
      </div>
    </div>

    <p class="results-feedback-text">${msg}</p>

    <div class="stats-row">
      <div class="stat-block">
        <div class="stat-block-value" style="color:#2d7a3a">${correct}</div>
        <div class="stat-block-label">Corretas</div>
      </div>
      <div class="stat-block">
        <div class="stat-block-value" style="color:#c0392b">${questions.length - correct}</div>
        <div class="stat-block-label">Incorretas</div>
      </div>
      <div class="stat-block">
        <div class="stat-block-value" style="color:#5c1a1a">${pct}%</div>
        <div class="stat-block-label">Aproveitamento</div>
      </div>
    </div>

    <div class="answer-review">
      <div class="review-title">Revisão por questão</div>
      <div class="review-grid">${reviewPips}</div>
    </div>

    <button class="retry-btn" onclick="restart()">Recomeçar o Quiz</button>
  `;
}

function restart() {
  current = 0;
  answers = {};
  document.getElementById('resultsCard').style.display = 'none';
  document.getElementById('quizCard').style.display = 'block';
  document.getElementById('progressSection').style.opacity = '1';
  buildDots();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildDots();
render();
</script>
</body>
</html>
